<template id="compare-section" data-bind="{i18n}">
  <section class="shell compare-grid" aria-label="Authoring comparison">
    <article class="card compare-card bg-base-200 border border-base-300">
      <div class="card-body">
        <div class="compare-head">
          <span class="compare-note" data-t="${i18n.compare.other_note}">Learn the abstraction first</span>
        </div>
        <div class="code-window compare-code code-muted">
          <div class="code-window-bar">
            <span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span>
            <span class="code-window-title">posts.astro</span>
          </div>
          <pre><code><span class="syn-punc">---</span>
<span class="syn-key">const</span> posts = <span class="syn-key">await</span> getCollection(<span class="syn-string">"posts"</span>);
<span class="syn-punc">---</span>

<span class="syn-punc">{</span>posts.map(post =&gt; (
  <span class="syn-tag">&amp;lt;Card</span> <span class="syn-attr">post</span>=<span class="syn-punc">{</span>post<span class="syn-punc">}</span> <span class="syn-tag">/&amp;gt;</span>
))<span class="syn-punc">}</span></code></pre>
        </div>
      </div>
    </article>

    <article class="card compare-card statica-card bg-primary text-primary-content">
      <div class="card-body">
        <div class="compare-head">
          <span class="compare-note" data-t="${i18n.compare.statica_note}">Keep writing HTML</span>
        </div>
        <div class="code-window compare-code code-featured">
          <div class="code-window-bar">
            <span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span>
            <span class="code-window-title">index.html</span>
          </div>
          <pre><code><span class="syn-tag">&amp;lt;link</span>
  <span class="syn-attr">rel</span>=<span class="syn-string">"statica/data"</span>
  <span class="syn-attr">href</span>=<span class="syn-string">"./posts.json"</span>
  <span class="syn-attr">id</span>=<span class="syn-string code-marker marker-posts marker-source">"posts"</span>
<span class="syn-tag">/&amp;gt;</span>

<span class="syn-tag">&amp;lt;link</span>
  <span class="syn-attr">rel</span>=<span class="syn-string">"statica/fragment"</span>
  <span class="syn-attr">type</span>=<span class="syn-string">"text/html"</span>
  <span class="syn-attr">href</span>=<span class="syn-string">"./ui/post-card.html"</span>
  <span class="syn-attr">id</span>=<span class="syn-string code-marker marker-fragment marker-source">"post-card"</span>
<span class="syn-tag">/&amp;gt;</span>

<span class="syn-tag">&amp;lt;slot</span> <span class="syn-attr">id</span>=<span class="syn-string code-marker marker-fragment marker-target">"post-card"</span> <span class="syn-attr">data-each</span>=<span class="syn-string code-marker marker-posts marker-target">"posts"</span><span class="syn-tag">&amp;gt;&amp;lt;/slot&amp;gt;</span></code></pre>
        </div>
      </div>
    </article>
  </section>
</template>

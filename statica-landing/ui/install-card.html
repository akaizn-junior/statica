<template id="install-card" data-bind="{label, command, copy, copied}">
  <article class="card install-card bg-base-200 border border-base-300">
    <div class="card-body">
      <span class="badge badge-ghost" data-t="${label}">Install</span>
      <div class="code-window install-code">
        <div class="code-window-bar compact">
          <span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span>
          <span class="code-window-title" data-t="${label}">Install</span>
        </div>
        <div class="terminal-lines compact">
          <div class="terminal-line"><span class="prompt">$</span><code data-t="${command}">install statica</code></div>
        </div>
      </div>
      <button class="btn btn-sm btn-ghost copy-command" type="button" data-copy="${command}" data-copied="${copied}" data-t="${copy}">Copy command</button>
    </div>
  </article>

  <script type="module">
    const button = $('.copy-command');
    button?.addEventListener('click', async () => {
      const command = button.dataset.copy;
      if (!command) return;
      await navigator.clipboard.writeText(command);
      const previous = button.textContent;
      button.textContent = button.dataset.copied || 'Copied';
      setTimeout(() => { button.textContent = previous; }, 1200);
    });
  </script>
</template>

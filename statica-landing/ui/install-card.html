<template id="install-card" data-bind="{label, command}">
  <article class="card install-card bg-base-200 border border-base-300">
    <div class="card-body">
      <span class="badge badge-ghost" data-t="${label}">Install</span>
      <div class="mockup-code install-code">
        <pre data-prefix="$"><code data-t="${command}">install statica</code></pre>
      </div>
      <button class="btn btn-sm btn-ghost copy-command" type="button" data-copy="${command}">Copy command</button>
    </div>
  </article>

  <script type="module">
    const button = $('.copy-command');
    button?.addEventListener('click', async () => {
      const command = button.dataset.copy;
      if (!command) return;
      await navigator.clipboard.writeText(command);
      const previous = button.textContent;
      button.textContent = 'Copied';
      setTimeout(() => { button.textContent = previous; }, 1200);
    });
  </script>
</template>

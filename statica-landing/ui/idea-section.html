<template id="idea-section" data-bind="{i18n}">
  <section id="why" class="section shell">
    <div class="section-copy">
      <h2 data-t="${i18n.idea.title}">The web already has a language.</h2>
      <p class="section-lead" data-t="${i18n.idea.lead}">Static site generators keep inventing another one. statica doesn’t.</p>
      <p data-t="${i18n.idea.body}">Use HTML for structure, CSS for style, JavaScript for behavior, and structured data when you need to generate content. statica handles the build, then gets out of the way.</p>
    </div>
  </section>
</template>

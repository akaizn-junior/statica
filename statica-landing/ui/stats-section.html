<template id="stats-section" data-bind="{i18n}">
  <section class="shell proof-wrap" aria-label="Core promise">
    <div class="stats stats-grid border border-base-300">
      <div class="stat">
        <div class="stat-title" data-t="${i18n.stats.templates}">Template languages</div>
        <div class="stat-value">0</div>
        <div class="stat-desc" data-t="${i18n.stats.templates_desc}">HTML is enough</div>
      </div>
      <div class="stat">
        <div class="stat-title" data-t="${i18n.stats.runtime}">Framework runtime</div>
        <div class="stat-value">0</div>
        <div class="stat-desc" data-t="${i18n.stats.runtime_desc}">Ship the web platform</div>
      </div>
      <div class="stat">
        <div class="stat-title" data-t="${i18n.stats.build_tool}">Build tool</div>
        <div class="stat-value">1</div>
        <div class="stat-desc">statica</div>
      </div>
      <div class="stat">
        <div class="stat-title" data-t="${i18n.stats.language}">Authoring language</div>
        <div class="stat-value stat-html">HTML</div>
        <div class="stat-desc" data-t="${i18n.stats.language_desc}">all the way down</div>
      </div>
    </div>
  </section>
</template>

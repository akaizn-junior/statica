<template id="feature-card" data-bind="{eyebrow, title, body}">
  <article class="card feature-card bg-base-200 border border-base-300">
    <div class="card-body">
      <span class="badge badge-outline badge-sm" data-t="${eyebrow}">Feature</span>
      <h3 class="card-title" data-t="${title}">Feature title</h3>
      <p data-t="${body}">Feature description</p>
    </div>
  </article>
</template>

<template id="button">
  <style>
    .btn {
      background: #089868;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      cursor: pointer;
      font-weight: 800;
    }
    .btn[data-pressed="true"] {
      background: #057451;
    }
  </style>
  <button class="btn" type="button"><slot>Click me</slot></button>
  <script type="module">
    document.querySelector(".btn")?.addEventListener("click", () => {
      document.querySelector(".btn").dataset.pressed = "true";
    });
  </script>
</template>

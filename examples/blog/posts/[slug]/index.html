<!doctype html>
<html lang="en" data-bind="{item}">
  <head>
    <link rel="statica/layout" href="../../layouts/base.html" />
    <title>Post</title>
    <link
      rel="statica/fragment"
      type="text/html"
      href="../../ui/post-card.html"
      id="post-card"
    />
    <link
      rel="statica/fragment"
      type="text/html"
      href="../../ui/related-posts.html"
      id="related-posts"
    />
    <link rel="statica/data" href="../../content/posts/*.md" id="posts" />
  </head>
  <body>
    <article class="content-panel">
      <header>
        <h1 data-t="${item.headline}">Post</h1>
        <time data-t="${item.published_at}"></time>
      </header>
      <p class="lede" data-t="${item.summary}"></p>
      <div class="article-body" data-t="${item.html}"></div>
      <slot id="post-card"></slot>
      <aside class="related">
        <h2 class="related__title">More from the archive</h2>
        <ul class="related__list">
          <slot id="related-posts" data-each="item.related"></slot>
        </ul>
      </aside>
    </article>
    <p><a href="/blog/">All posts</a></p>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title><slot name="item.headline"></slot></title>
    <link rel="stylesheet" href="/site.css" />
    <link
      rel="statica/font"
      href="@Google/?family=Outfit:wght@400;600&display=swap"
    />
    <link
      rel="statica/fragment"
      type="text/html"
      href="../../ui/post-card.html"
      id="post-card"
    />
    <link
      rel="statica/fragment"
      type="text/html"
      href="../../ui/related-posts.html"
      id="related-posts"
    />
    <link rel="statica/data" href="../../content/posts/*.md" id="posts" />
  </head>
  <body>
    <article>
      <header>
        <h1><slot name="item.headline"></slot></h1>
        <time><slot name="item.published_at"></slot></time>
      </header>
      <p><slot name="item.summary"></slot></p>
      <div><slot name="item.html"></slot></div>
      <slot id="post-card"></slot>
      <slot id="related-posts">More from the archive</slot>
    </article>
    <p><a href="/blog/">← All posts</a></p>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="corporate" data-bind="{page}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dealership Inventory</title>
    <meta name="description" content="Browse paginated dealership inventory generated from CSV data." />
    <link rel="canonical" href="https://example.com${page.pagination.href}" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/public/dashboard.css" />
    <link rel="statica/data" type="text/csv" href="../../content/inventory.csv" id="inventory" />
    <link rel="statica/fragment" type="text/html" href="../../ui/inventory-card.html" id="inventory-card" />
    <link rel="statica/fragment" type="text/html" href="../../ui/page-link.html" id="page-link" />
  </head>
  <body id="top">
    <main class="site-shell">
      <nav class="topbar">
        <div class="brand">
          <img class="brand-logo" src="/public/statica-logo.png" alt="statica logo" />
          <a href="/">statica dealer</a>
        </div>
        <div class="topbar-links">
          <input type="statica/search" placeholder="Search inventory" />
          <a href="/">Dashboard</a>
          <a class="is-active" href="/inventory/">Inventory</a>
        </div>
        <details class="mobile-menu">
          <summary>Menu</summary>
          <div>
            <input type="statica/search" placeholder="Search inventory" />
            <a href="/">Dashboard</a>
            <a href="/inventory/">Inventory</a>
          </div>
        </details>
      </nav>
      <header class="hero-panel compact">
        <div>
          <img class="hero-logo compact-logo" src="/public/statica-logo.png" alt="statica logo" />
          <h1>Browse vehicles</h1>
          <p class="timestamp">Page <slot name="page.pagination.page"></slot> of <slot name="page.pagination.total_pages"></slot> · 24 vehicles per page</p>
        </div>
      </header>

      <section class="inventory-grid" aria-label="Vehicles">
        <slot id="inventory-card" data-each="page.pagination.items"></slot>
      </section>

      <nav class="pagination" aria-label="Inventory pages">
        <a href="${page.pagination.prev_href}">Previous</a>
        <slot id="page-link" data-each="page.pagination.pages"></slot>
        <a href="${page.pagination.next_href}">Next</a>
      </nav>
      <footer class="site-footer">
        <div class="brand">
          <img class="brand-logo" src="/public/statica-logo.png" alt="statica logo" />
          <a href="/">statica dealer</a>
        </div>
        <nav>
          <a href="/">Dashboard</a>
          <a href="/sitemap.xml">Sitemap</a>
          <a href="/rss.xml">RSS</a>
          <a href="#top">Back to top</a>
        </nav>
      </footer>
    </main>
  </body>
</html>

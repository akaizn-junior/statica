site_url = "https://example.com"
out_dir = ".website"
clean = true
copy_assets = true

[process]
css = true

[sitemap]
enabled = true

[rss]
enabled = true
title = "Dealership inventory"
description = "Latest dealership inventory from CSV data."
collections = ["inventory"]
title_field = "headline"
description_field = "summary"
date_field = "published_at"
limit = 40

[search]
enabled = true
limit = 10
filters = ["make", "status", "condition", "location"]
url_field = "url"

[[pagination]]
route = "inventory/[page]"
page_size = 24
sort_by = "published_at"
sort_desc = true
index = true

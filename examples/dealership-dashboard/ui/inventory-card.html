<template
  id="inventory-card"
  data-bind="{slug, headline, summary, stock_number, status, condition, list_price, days_in_stock, location}"
>
  <article class="inventory-card">
    <div class="vehicle-topline">
      <div>
        <p data-t="${stock_number}"></p>
        <h2><a href="/vehicles/${slug}/" data-t="${headline}">Vehicle</a></h2>
      </div>
      <span class="status-pill" data-t="${status}"></span>
    </div>
    <p class="vehicle-summary" data-t="${summary}"></p>
    <dl>
      <div><dt>Condition</dt><dd data-t="${condition}"></dd></div>
      <div><dt>Price</dt><dd>$<span data-t="${list_price}"></span></dd></div>
      <div><dt>Age</dt><dd><span data-t="${days_in_stock}"></span>d</dd></div>
      <div><dt>Location</dt><dd data-t="${location}"></dd></div>
    </dl>
    <a class="card-link" href="/vehicles/${slug}/">View details</a>
  </article>
</template>

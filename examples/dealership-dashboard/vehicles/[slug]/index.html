<!doctype html>
<html lang="en" data-theme="corporate" data-bind="{item}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicle Detail</title>
    <meta name="description" content="${item.summary}" />
    <link rel="canonical" href="https://example.com/vehicles/${item.slug}/" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/public/dashboard.css" />
    <link rel="statica/data" type="text/csv" href="../../content/inventory.csv" id="inventory" />
  </head>
  <body id="top">
    <main class="site-shell">
      <nav class="topbar">
        <div class="brand">
          <img class="brand-logo" src="/public/statica-logo.png" alt="statica logo" />
          <a href="/">statica dealer</a>
        </div>
        <div class="topbar-links">
          <input type="statica/search" placeholder="Search inventory" />
          <a href="/">Dashboard</a>
          <a class="is-active" href="/inventory/">Inventory</a>
        </div>
        <details class="mobile-menu">
          <summary>Menu</summary>
          <div>
            <input type="statica/search" placeholder="Search inventory" />
            <a href="/">Dashboard</a>
            <a href="/inventory/">Inventory</a>
          </div>
        </details>
      </nav>
      <header class="hero-panel compact">
        <div>
          <img class="hero-logo compact-logo" src="/public/statica-logo.png" alt="statica logo" />
          <p class="eyebrow"><slot name="item.stock_number"></slot></p>
          <h1><slot name="item.headline"></slot></h1>
          <p class="timestamp"><slot name="item.status"></slot></p>
        </div>
      </header>

      <section class="vehicle-detail" aria-label="Vehicle details">
        <article class="detail-panel">
          <h2>Vehicle</h2>
          <dl>
            <div><dt>Condition</dt><dd><slot name="item.condition"></slot></dd></div>
            <div><dt>Body</dt><dd><slot name="item.body_style"></slot></dd></div>
            <div><dt>Fuel</dt><dd><slot name="item.fuel_type"></slot></dd></div>
            <div><dt>Color</dt><dd><slot name="item.exterior_color"></slot></dd></div>
            <div><dt>Mileage</dt><dd><slot name="item.mileage"></slot></dd></div>
          </dl>
        </article>
        <article class="detail-panel">
          <h2>Commercials</h2>
          <dl>
            <div><dt>List price</dt><dd>$<slot name="item.list_price"></slot></dd></div>
            <div><dt>Gross margin</dt><dd>$<slot name="item.gross_margin"></slot></dd></div>
            <div><dt>Days in stock</dt><dd><slot name="item.days_in_stock"></slot></dd></div>
            <div><dt>Location</dt><dd><slot name="item.location"></slot></dd></div>
            <div><dt>Lead channel</dt><dd><slot name="item.lead_channel">Not assigned</slot></dd></div>
          </dl>
        </article>
      </section>
      <footer class="site-footer">
        <div class="brand">
          <img class="brand-logo" src="/public/statica-logo.png" alt="statica logo" />
          <a href="/">statica dealer</a>
        </div>
        <nav>
          <a href="/">Dashboard</a>
          <a href="/inventory/">Inventory</a>
          <a href="/sitemap.xml">Sitemap</a>
          <a href="/rss.xml">RSS</a>
          <a href="#top">Back to top</a>
        </nav>
      </footer>
    </main>
  </body>
</html>

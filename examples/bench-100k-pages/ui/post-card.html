<template id="post-card" data-bind="{slug, headline, published_at, summary, author, category}">
  <article>
    <h2><a href="./${slug}/" data-t="${headline}">Post</a></h2>
    <p class="meta">
      <span data-t="${published_at}"></span> · <span data-t="${author}"></span> · <span data-t="${category}"></span> · <code data-t="${slug}"></code>
    </p>
    <p data-t="${summary}"></p>
    <p><a href="./${slug}/">Read post</a></p>
  </article>
</template>

<!doctype html>
<html lang="en" data-bind="{page}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/public/statica-logo.png" type="image/png" />
    <title data-t="Page ${page.pagination.page}">Page</title>
    <link
      rel="statica/fragment"
      type="text/html"
      href="../../ui/post-card.html"
      id="post-card"
    />
    <link rel="statica/data" href="../../content/posts.json" id="posts" />
    <style>
      body { margin: 0; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
      main { width: min(100% - 2rem, 44rem); margin: 0 auto; padding: 2rem 0 4rem; }
      header, nav { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
      nav { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #dbe3df; }
      img { width: 2.5rem; height: 2.5rem; object-fit: contain; }
      a { color: #089868; font-weight: 800; }
      .meta { color: #64748b; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a href="/"><img src="/public/statica-logo.png" alt="statica logo" /></a>
        <p class="meta">
          page <span data-t="${page.pagination.page}"></span> of
          <span data-t="${page.pagination.total_pages}"></span>
        </p>
      </header>
      <slot id="post-card" data-each="page.pagination.items"></slot>
      <nav>
        <a href="${page.pagination.first_href}">First</a>
        <a href="${page.pagination.prev_href}">Previous</a>
        <a href="${page.pagination.next_href}">Next</a>
        <a href="${page.pagination.last_href}">Last</a>
      </nav>
    </main>
  </body>
</html>

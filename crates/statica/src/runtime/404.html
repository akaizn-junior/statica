<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 Not Found</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Karla, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background-image:
          linear-gradient(color-mix(in oklab, currentColor 4%, transparent) 1px, transparent 1px),
          linear-gradient(90deg, color-mix(in oklab, currentColor 4%, transparent) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 1rem;
        width: min(100% - 2rem, 34rem);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 0.9;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #475569;
        line-height: 1.5;
      }
      a {
        color: #089868;
        font-size: 12px;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.25em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>The page you are looking for does not exist.</p>
    </main>
  </body>
</html>
